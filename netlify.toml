[build]
  command = "rm -rf .netlify-build && mkdir -p .netlify-build && unzip -q AMC_Shopping_DEPLOY_READY_v5_2.zip -d .netlify-build && node deploy-promo/inject.mjs .netlify-build/AMC_Shopping_DEPLOY_READY_v5_2/site && node deploy-course/inject.mjs .netlify-build/AMC_Shopping_DEPLOY_READY_v5_2/site && node deploy-v55/inject.mjs .netlify-build/AMC_Shopping_DEPLOY_READY_v5_2/site"
  publish = ".netlify-build/AMC_Shopping_DEPLOY_READY_v5_2/site"

[functions]
  directory = ".netlify-build/AMC_Shopping_DEPLOY_READY_v5_2/netlify/functions"

[[redirects]]
  from = "/api/generate-mailbox"
  to = "/.netlify/functions/generate-mailbox"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
